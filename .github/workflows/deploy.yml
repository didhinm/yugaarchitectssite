name: Deploy to GitHub Pages

# The live site deploys from release branches named `*-live-build` (first-live-build, second-live-build, …).
# `main` is for day-to-day work and never deploys. The newest release branch is the live one;
# older ones are kept for rollback. See docs/content-guide.md.
on:
  push:
    branches: ['*-live-build']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
